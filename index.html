<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signals">
<title>Signal Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14; --panel: #121922; --panel-2: #18212c; --line: #243040;
    --text: #e8eef5; --muted: #8796a8; --faint: #5b6878;
    --buy: #1fc77e; --buy-bg: rgba(31,199,126,.12);
    --sell: #ff5468; --sell-bg: rgba(255,84,104,.12);
    --wait: #f2b544; --wait-bg: rgba(242,181,68,.10);
    --accent: #4da3ff;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 520px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  h1 span { color: var(--accent); }
  .badge { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 99px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .badge.live { color: var(--buy); border-color: rgba(31,199,126,.35); }
  .badge.demo { color: var(--wait); border-color: rgba(242,181,68,.35); }

  .label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin: 0 0 8px; }
  .pairs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 10px; padding: 11px 0; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .chip small { display: block; font-size: 10px; color: var(--faint); font-weight: 500; margin-top: 2px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #06111f; }
  .chip.on small { color: rgba(6,17,31,.7); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px;
    padding: 9px 0; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .seg button.on { background: var(--panel-2); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; align-items: center; padding: 0 12px; }
  .field span { color: var(--faint); font-size: 13px; }
  .field input { width: 100%; background: transparent; border: 0; color: var(--text); outline: none;
    font: 600 15px var(--mono); padding: 11px 6px; }
  .toggles { display: flex; gap: 18px; margin: -4px 0 18px; color: var(--muted); font-size: 13px; }
  .toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggles input { accent-color: var(--accent); width: 16px; height: 16px; }

  .go { width: 100%; border: 0; border-radius: 14px; padding: 17px; cursor: pointer;
    background: var(--accent); color: #06111f; font: 800 17px Inter, sans-serif; letter-spacing: -.01em; }
  .go:disabled { opacity: .55; }
  .hint { text-align: center; color: var(--faint); font-size: 12px; margin: 10px 0 0; min-height: 16px; }

  .card { margin-top: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
    overflow: hidden; }
  .hero { padding: 18px 18px 16px; }
  .hero.buy { background: var(--buy-bg); } .hero.sell { background: var(--sell-bg); }
  .hero.wait { background: var(--wait-bg); }
  .verdict { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .verdict b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .buy .verdict b { color: var(--buy); } .sell .verdict b { color: var(--sell); }
  .wait .verdict b { color: var(--wait); font-size: 26px; }
  .verdict span { font: 600 14px var(--mono); color: var(--muted); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.45; }

  .levels { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .lv { padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
  .lv:nth-child(odd) { border-right: 1px solid var(--line); }
  .lv .k { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .lv .v { font: 700 18px var(--mono); margin-top: 3px; }
  .lv .x { font-size: 11px; color: var(--faint); margin-top: 1px; }
  .lv.sl .v { color: var(--sell); } .lv.tp .v { color: var(--buy); }
  .lv.copied::after { content: "Copied"; position: absolute; right: 12px; top: 12px; font-size: 10px;
    color: var(--accent); font-weight: 700; }

  .section { padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  .section:last-child { border-bottom: 0; }
  .section h3 { margin: 0 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .section ul { margin: 0; padding-left: 18px; }
  .timer { font: 700 14px var(--mono); color: var(--wait); }
  .warn { color: var(--wait); font-size: 13px; }
  .err { padding: 16px 18px; color: var(--sell); }
  .hero.pending { background: transparent; border-bottom: 1px dashed var(--line); }
  .muted { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .pill { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid rgba(77,163,255,.4);
    border-radius: 99px; padding: 2px 8px; margin-left: 6px; }
  .sidehead { font: 800 13px Inter, sans-serif; letter-spacing: .06em; }
  .sidehead.b { color: var(--buy); } .sidehead.s { color: var(--sell); }

  details { border-top: 1px solid var(--line); }
  summary { padding: 14px 18px; cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .votes { padding: 0 18px 14px; }
  .votes h4 { margin: 12px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .vote { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 6px 0; font-size: 13px;
    border-bottom: 1px dashed var(--line); }
  .vote:last-child { border-bottom: 0; }
  .vote i { font-style: normal; font: 700 11px var(--mono); padding-top: 2px; }
  .vote i.b { color: var(--buy); } .vote i.s { color: var(--sell); }
  .vote div small { display: block; color: var(--faint); }

  .foot { color: var(--faint); font-size: 11px; text-align: center; margin-top: 22px; line-height: 1.5; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(6,17,31,.3);
    border-top-color: #06111f; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Signal<span>Engine</span></h1>
    <span id="mode" class="badge">29 strategies</span>
  </header>

  <p class="label">Pair</p>
  <div class="pairs" id="pairs"></div>

  <div class="row">
    <div>
      <p class="label">Timeframe</p>
      <div class="seg" id="tf">
        <button data-v="1min">1m</button><button data-v="5min">5m</button><button data-v="15min">15m</button><button data-v="1h">1h</button>
      </div>
    </div>
    <div>
      <p class="label">Risk per trade</p>
      <div class="field"><input id="risk" inputmode="decimal" value="2"><span>%</span></div>
    </div>
  </div>

  <p class="label">Balance (USD)</p>
  <div class="field" style="margin-bottom:12px"><span>$</span><input id="balance" inputmode="decimal" value="100"></div>

  <div class="toggles">
    <label><input type="checkbox" id="cent"> Cent account</label>
    <label><input type="checkbox" id="watch"> Watch (check every 30s)</label>
  </div>

  <button class="go" id="go">Get signal</button>
  <p class="hint" id="hint"></p>

  <div id="out"></div>

  <p class="foot">Higher-timeframe filter: 1m→15m · 5m→1h · 15m→4h · 1h→4h<br>
  Not financial advice. Check the price in MT5 and the news calendar before entering.</p>
</div>

<script>
const PAIRS = [["XAU/USD","Gold"],["EUR/USD","EU"],["GBP/USD","GU"],["USD/JPY","UJ"],["BTC/USD","BTC"]];
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("se_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("se_" + k, JSON.stringify(v)); } catch {} },
};
let state = {
  symbol: store.get("symbol", "XAU/USD"), tf: store.get("tf", "1min"),
  balance: store.get("balance", 100), risk: store.get("risk", 2), cent: store.get("cent", false),
};
let password = store.get("pw", "");
let watchTimer = null, lastSignal = null, busy = false;

// ---------- controls ----------
$("#pairs").innerHTML = PAIRS.map(([s, n]) =>
  `<button class="chip" data-v="${s}">${n}<small>${s.replace("/USD","").replace("USD/","")}</small></button>`).join("");
function paint() {
  document.querySelectorAll("#pairs .chip").forEach(b => b.classList.toggle("on", b.dataset.v === state.symbol));
  document.querySelectorAll("#tf button").forEach(b => b.classList.toggle("on", b.dataset.v === state.tf));
  $("#balance").value = state.balance; $("#risk").value = state.risk; $("#cent").checked = state.cent;
}
$("#pairs").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
  state.symbol = b.dataset.v; store.set("symbol", state.symbol); paint(); lastSignal = null; getSignal(); };
$("#tf").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  state.tf = b.dataset.v; store.set("tf", state.tf); paint(); };
$("#balance").onchange = e => { state.balance = parseFloat(e.target.value) || 100; store.set("balance", state.balance); };
$("#risk").onchange = e => { state.risk = parseFloat(e.target.value) || 2; store.set("risk", state.risk); };
$("#cent").onchange = e => { state.cent = e.target.checked; store.set("cent", state.cent); };
$("#go").onclick = () => getSignal();
$("#watch").onchange = e => {
  clearInterval(watchTimer);
  if (e.target.checked) { getSignal(); watchTimer = setInterval(() => getSignal(true), 30000); }
  $("#hint").textContent = e.target.checked ? "Watching… you'll get a beep when a trade appears." : "";
};
paint();

// ---------- fetch ----------
async function getSignal(silent = false) {
  if (busy) return;
  busy = true;
  const btn = $("#go");
  if (!silent) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Reading the market…'; }
  const q = new URLSearchParams({ symbol: state.symbol, tf: state.tf, balance: state.balance,
                                  risk: state.risk, cent: state.cent });
  try {
    const res = await fetch("/api/signal?" + q, { headers: password ? { "X-App-Password": password } : {} });
    if (res.status === 401) {
      const pw = prompt("Enter your app password");
      if (pw) { password = pw; store.set("pw", pw); busy = false; return getSignal(silent); }
      throw new Error("Password needed");
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.detail || "Something went wrong");
    render(data);
    if (data.signal !== "NO TRADE" && lastSignal !== data.signal + data.entry) alertTrade();
    lastSignal = data.signal === "NO TRADE" ? null : data.signal + data.entry;
  } catch (err) {
    $("#out").innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div></div>`;
  } finally {
    busy = false; btn.disabled = false; btn.textContent = "Get signal";
  }
}

// ---------- render ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function render(r) {
  const badge = $("#mode");
  badge.className = "badge " + (r.demo ? "demo" : "live");
  badge.textContent = r.demo ? "DEMO data" : "LIVE";

  const trade = r.signal === "BUY" || r.signal === "SELL";
  const cls = r.signal === "BUY" ? "buy" : r.signal === "SELL" ? "sell" : "wait";
  const now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const conf = r.confidence !== undefined ? ` · ${r.confidence}% agree` : "";
  const sub = `${r.interval}: <b>${esc(r.regime)}</b> (${esc(r.regime_reason)}) · ${r.buy_votes} buy / ${r.sell_votes} sell${conf}
               <br>${r.htf} trend: <b>${esc(r.htf_bias)}</b> · checked ${now}`;

  const limits = r.limit_orders || [];
  const lcls = !trade && limits.length === 1 ? (limits[0].side.startsWith("BUY") ? "buy" : "sell") : cls;
  const title = trade ? r.signal + " now" : limits.length === 1 ? limits[0].side.replace("LIMIT", "limit")
              : limits.length > 1 ? "Range limits" : "No trade";
  let html = `<div class="card"><div class="hero ${lcls}${!trade && limits.length ? " pending" : ""}">
    <div class="verdict"><b>${title}</b><span>${esc(r.symbol)} ${r.price}</span></div>
    <div class="sub">${sub}</div></div>`;

  if (trade) {
    const lv = (k, v, x, c = "") => `<div class="lv ${c}" data-copy="${v}"><div class="k">${k}</div><div class="v">${v}</div><div class="x">${x}</div></div>`;
    html += `<div class="levels">
      ${lv("Entry (market)", r.entry, "tap to copy")}
      ${lv("Lot size", r.lot_size, "risk $" + r.risk_amount)}
      ${lv("Stop loss", r.stop_loss, "−" + r.sl_distance, "sl")}
      ${lv("Take profit 1", r.take_profit_1, r.rr_tp1, "tp")}
      ${lv("Take profit 2", r.take_profit_2, r.rr_tp2, "tp")}
      ${lv("Agreement", r.confidence + "%", r.buy_votes + " buy / " + r.sell_votes + " sell")}
    </div>
    <div class="section"><h3>Entry triggers</h3>${r.triggers.map(esc).join(" · ")}</div>`;
  } else if (limits.length) {
    const lv = (k, v, x, c = "") => `<div class="lv ${c}" data-copy="${v}"><div class="k">${k}</div><div class="v">${v}</div><div class="x">${x}</div></div>`;
    limits.forEach(p => {
      const buy = p.side.startsWith("BUY");
      html += `${limits.length > 1 ? `<div class="section sidehead ${buy ? "b" : "s"}">${p.side}</div>` : ""}
      <div class="levels">
        ${lv(p.side.replace(" LIMIT", " limit at"), p.entry, (buy ? "▼ " : "▲ ") + p.distance_from_price + " from price")}
        ${lv("Lot size", p.lot_size, "risk $" + p.risk_amount)}
        ${lv("Stop loss", p.stop_loss, "−" + p.sl_distance, "sl")}
        ${lv("Take profit 1", p.take_profit_1, p.rr_tp1, "tp")}
        ${lv("Take profit 2", p.take_profit_2, p.rr_tp2, "tp")}
        ${lv("Cancel at", clock(p.expires_in_minutes), "if not filled (" + p.expires_in_minutes + " min)")}
      </div>
      <div class="section"><h3>Zone</h3>${esc(p.zone)}${p.confluence > 1 ? ` <span class="pill">${p.confluence} confluences</span>` : ""}
        <div class="muted">Bias: ${esc(p.bias)}</div>
        ${p.lot_note ? `<div class="warn">⚠ ${esc(p.lot_note)}</div>` : ""}</div>`;
    });
    html += `<div class="section"><h3>Why no market entry now</h3><ul>${(r.reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="muted">Prices move — tap Get signal again before placing, and cancel the order if the signal changes side.</div></div>`;
  } else {
    html += `<div class="section"><h3>Why not</h3><ul>${(r.reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      ${r.limit_note ? `<div class="muted">${esc(r.limit_note)}</div>` : ""}</div>`;
  }
  if (r.warnings && r.warnings.length) {
    html += `<div class="section">${r.warnings.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}</div>`;
  }
  const row = v => `<div class="vote"><i class="${v.vote > 0 ? "b" : "s"}">${v.vote > 0 ? "BUY" : "SELL"}</i>
                     <div>${esc(v.strategy)}<small>${esc(v.reason)}</small></div></div>`;
  const on = (r.votes || []).filter(v => v.active && v.vote !== 0);
  const off = (r.votes || []).filter(v => !v.active && v.vote !== 0);
  html += `<details><summary>See all strategy votes</summary><div class="votes">
      <h4>Counting in ${esc(r.regime)} (${on.length})</h4>${on.map(row).join("") || "<small>None</small>"}
      <h4>Switched off in this regime (${off.length})</h4>${off.map(row).join("") || "<small>None</small>"}
    </div></details></div>`;
  $("#out").innerHTML = html;

  document.querySelectorAll(".lv[data-copy]").forEach(el => el.onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(el.dataset.copy);
    el.classList.add("copied"); setTimeout(() => el.classList.remove("copied"), 1200);
  });
}

function clock(mins) {
  return new Date(Date.now() + mins * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

// ---------- alert when a trade appears ----------
function alertTrade() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .15);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .16); });
  } catch {}
}
</script>
</body>
</html>
